<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PesaEx | Professional Live Trading & Signal Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: { burgundy: '#581c87', rose: '#f43f5e', dark: '#0f172a' }
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </head>
  <body class="min-h-screen bg-[#0b0f19] text-slate-100 antialiased">
    <div id="root"></div>

    <!-- Self-Contained Trading Dashboard App with LocalStorage Persistence -->
    <script type="text/babel">
      function TradingDashboard() {
        const [asset, setAsset] = React.useState('BTC/USD');
        const [price, setPrice] = React.useState(91420.50);
        const [orderType, setOrderType] = React.useState('market');
        const [side, setSide] = React.useState('buy');
        const [amount, setAmount] = React.useState('0.25');
        const [leverage, setLeverage] = React.useState('10');
        const [takeProfit, setTakeProfit] = React.useState('95000');
        const [stopLoss, setStopLoss] = React.useState('89000');
        const [notes, setNotes] = React.useState('Breakout confirmation on 4H chart.');
        
        // Load positions from LocalStorage or use default mock positions
        const [positions, setPositions] = React.useState(() => {
          const saved = localStorage.getItem('pesaex_positions');
          if (saved) {
            try { return JSON.parse(saved); } catch(e) { }
          }
          return [
            { id: 1, asset: 'BTC/USD', type: 'LONG', entry: 90800, size: '0.5 BTC', lev: '10x', pnl: '+$310.25', pnlClass: 'text-emerald-400' },
            { id: 2, asset: 'ETH/USD', type: 'SHORT', entry: 3420, size: '4.2 ETH', lev: '5x', pnl: '-$42.10', pnlClass: 'text-rose-400' }
          ];
        });
        
        const [modalOpen, setModalOpen] = React.useState(false);
        const [signalLink, setSignalLink] = React.useState('');
        const [copied, setCopied] = React.useState(false);

        // Save positions to LocalStorage whenever they change
        React.useEffect(() => {
          localStorage.setItem('pesaex_positions', JSON.stringify(positions));
        }, [positions]);

        // Live price fluctuation simulation
        React.useEffect(() => {
          const interval = setInterval(() => {
            setPrice(prev => Number((prev + (Math.random() * 40 - 19.8)).toFixed(2)));
          }, 1200);
          return () => clearInterval(interval);
        }, []);

        const handleExecuteTrade = (e) => {
          e.preventDefault();
          const newPos = {
            id: Date.now(),
            asset: asset,
            type: side.toUpperCase(),
            entry: price,
            size: `${amount} ${asset.split('/')[0]}`,
            lev: `${leverage}x`,
            pnl: '+$0.00',
            pnlClass: 'text-slate-400'
          };
          setPositions([newPos, ...positions]);
        };

        const clearHistory = () => {
          if (confirm('Clear all saved positions?')) {
            setPositions([]);
            localStorage.removeItem('pesaex_positions');
          }
        };

        const generateSignalLink = () => {
          const baseUrl = window.location.origin + window.location.pathname;
          const link = `${baseUrl}?asset=${encodeURIComponent(asset)}&side=${side}&entry=${price}&tp=${takeProfit}&sl=${stopLoss}&lev=${leverage}`;
          setSignalLink(link);
          setModalOpen(true);
          setCopied(false);
        };

        const copyToClipboard = () => {
          try {
            navigator.clipboard.writeText(signalLink);
            setCopied(true);
          } catch (err) {
            const textArea = document.createElement('textarea');
            textArea.value = signalLink;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            setCopied(true);
          }
        };

        return (
          <div className="min-h-screen bg-[#0b0f19] text-slate-100 flex flex-col font-sans">
            {/* Header */}
            <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 py-4 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-purple-600 flex items-center font-bold text-lg shadow-lg shadow-rose-500/20">P</div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    PesaEx Terminal <span className="text-xs px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">LIVE + PERSISTENT</span>
                  </h1>
                  <p className="text-xs text-slate-400">Institutional Multi-Asset Trading & LocalStorage Persistence</p>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={generateSignalLink} className="bg-gradient-to-r from-rose-600 to-purple-600 hover:from-rose-500 hover:to-purple-500 text-white px-4 py-2 rounded-lg font-medium text-sm shadow-md transition flex items-center gap-2">
                  <span>🔗 Share Live Signal Link</span>
                </button>
              </div>
            </header>

            {/* Main Grid */}
            <main className="flex-1 p-6 grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-7xl mx-auto w-full">
              {/* Left & Center: Chart & Order Book */}
              <div className="lg:col-span-2 space-y-6">
                <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-xl">
                  <div className="flex justify-between items-center mb-4">
                    <div className="flex items-center gap-3">
                      <select value={asset} onChange={(e) => setAsset(e.target.value)} className="bg-slate-800 border border-slate-700 text-white font-semibold px-3 py-1.5 rounded-lg outline-none">
                        <option value="BTC/USD">BTC/USD</option>
                        <option value="ETH/USD">ETH/USD</option>
                        <option value="SOL/USD">SOL/USD</option>
                        <option value="EUR/USD">EUR/USD</option>
                      </select>
                      <span className="text-2xl font-black tracking-tight text-white">${price.toLocaleString()}</span>
                      <span className="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded">+3.42%</span>
                    </div>
                    <div className="flex gap-1 bg-slate-800/60 p-1 rounded-lg text-xs">
                      {['1H', '4H', '1D', '1W'].map(tf => (
                        <button key={tf} className="px-3 py-1 rounded font-medium text-slate-300 hover:bg-slate-700 hover:text-white transition">{tf}</button>
                      ))}
                    </div>
                  </div>

                  {/* Simulated Candle Visualizer */}
                  <div className="h-64 bg-slate-950/60 rounded-xl border border-slate-800/60 p-4 flex items-end justify-between gap-1 overflow-hidden">
                    {[45, 52, 48, 60, 58, 65, 70, 68, 75, 82, 78, 85, 90, 88, 95, 102, 98, 105, 110, 108, 115, 120].map((h, i) => (
                      <div key={i} className="flex-1 flex flex-col items-center gap-1 group relative">
                        <div className={`w-full rounded-sm transition-all duration-500 ${i % 2 === 0 ? 'bg-emerald-500/80 group-hover:bg-emerald-400' : 'bg-rose-500/80 group-hover:bg-rose-400'}`} style={{ height: `${h}px` }}></div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Active Positions Table */}
                <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-xl">
                  <div className="flex justify-between items-center mb-3">
                    <h3 className="text-sm font-bold text-slate-300 uppercase tracking-wider">Active Open Positions (Saved Locally)</h3>
                    {positions.length > 0 && (
                      <button onClick={clearHistory} className="text-xs text-rose-400 hover:underline">Clear History</button>
                    )}
                  </div>
                  <div className="overflow-x-auto">
                    {positions.length === 0 ? (
                      <p className="text-xs text-slate-500 py-4 text-center">No active positions saved. Execute a trade to save it!</p>
                    ) : (
                      <table className="w-full text-left text-sm">
                        <thead className="text-xs text-slate-400 border-b border-slate-800">
                          <tr>
                            <th className="pb-3">Asset</th>
                            <th className="pb-3">Type</th>
                            <th className="pb-3">Entry Price</th>
                            <th className="pb-3">Size</th>
                            <th className="pb-3">Leverage</th>
                            <th className="pb-3">Unrealized PnL</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/50">
                          {positions.map(pos => (
                            <tr key={pos.id} className="hover:bg-slate-800/30">
                              <td className="py-3 font-semibold text-white">{pos.asset}</td>
                              <td className="py-3"><span className={`px-2 py-0.5 rounded text-xs font-bold ${pos.type === 'BUY' || pos.type === 'LONG' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>{pos.type}</span></td>
                              <td className="py-3 text-slate-300">${Number(pos.entry).toLocaleString()}</td>
                              <td className="py-3 text-slate-300">{pos.size}</td>
                              <td className="py-3 text-slate-300">{pos.lev}</td>
                              <td className={`py-3 font-bold ${pos.pnlClass}`}>{pos.pnl}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    )}
                  </div>
                </div>
              </div>

              {/* Right Column: Order Execution Panel */}
              <div className="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                <form onSubmit={handleExecuteTrade} className="space-y-4">
                  <h3 className="text-sm font-bold text-slate-200 uppercase tracking-wider">Place Order</h3>
                  <div className="grid grid-cols-2 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button type="button" onClick={() => setSide('buy')} className={`py-2 rounded-lg font-bold text-sm transition ${side === 'buy' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-600/30' : 'text-slate-400 hover:text-white'}`}>BUY / LONG</button>
                    <button type="button" onClick={() => setSide('sell')} className={`py-2 rounded-lg font-bold text-sm transition ${side === 'sell' ? 'bg-rose-600 text-white shadow-lg shadow-rose-600/30' : 'text-slate-400 hover:text-white'}`}>SELL / SHORT</button>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Order Type</label>
                    <select value={orderType} onChange={(e) => setOrderType(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white outline-none">
                      <option value="market">Market Order</option>
                      <option value="limit">Limit Order</option>
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Amount ({asset.split('/')[0]})</label>
                    <input type="number" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white outline-none" />
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 block mb-1">Leverage ({leverage}x)</label>
                    <input type="range" min="1" max="50" value={leverage} onChange={(e) => setLeverage(e.target.value)} className="w-full accent-rose-500 cursor-pointer" />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Take Profit ($)</label>
                      <input type="number" value={takeProfit} onChange={(e) => setTakeProfit(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white outline-none" />
                    </div>
                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Stop Loss ($)</label>
                      <input type="number" value={stopLoss} onChange={(e) => setStopLoss(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-white outline-none" />
                    </div>
                  </div>

                  <button type="submit" className={`w-full py-3.5 rounded-xl font-bold text-white shadow-lg transition ${side === 'buy' ? 'bg-emerald-600 hover:bg-emerald-500 shadow-emerald-600/20' : 'bg-rose-600 hover:bg-rose-500 shadow-rose-600/20'}`}>
                    Execute {side.toUpperCase()} Order
                  </button>
                </form>
              </div>
            </main>

            {/* Signal Modal */}
            {modalOpen && (
              <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl space-y-4">
                  <h3 className="text-lg font-bold text-white">Shareable Trade Signal Link</h3>
                  <p className="text-xs text-slate-400">Anyone with this link can view your live signal parameters and copy trade setup.</p>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs text-emerald-400 break-all font-mono">
                    {signalLink}
                  </div>
                  <div className="flex gap-3">
                    <button onClick={copyToClipboard} className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-medium py-2.5 rounded-xl transition text-sm">
                      {copied ? '✅ Copied to Clipboard!' : 'Copy Link'}
                    </button>
                    <button onClick={() => setModalOpen(false)} className="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium px-4 py-2.5 rounded-xl transition text-sm">
                      Close
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.render(<TradingDashboard />, document.getElementById('root'));
    </script>
  </body>
</html>
